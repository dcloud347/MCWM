# M2 正式三卡配置：单机 3 张 H100 SXM，由 torchrun 启动 3 个 FSDP 进程。
# batch_size 和 encoder_frame_chunk_size 都是“每张 GPU”的数值。
seed: 2026
device: cuda
precision: bf16
output_dir: artifacts/m2-world-model-3xh100-sxm

# 必须换成真实训练完成的 M1 checkpoint；三张卡会加载同一份冻结 encoder。
m1_checkpoint: artifacts/m1-visual-base/checkpoint-00024000.pt

data:
  root: data/canonical
  train_split: train
  validation_split: validation

  # 每条样本为 12 帧和 11 个 action blocks，在 4 FPS 下覆盖约 2.75 秒。
  frames_per_sample: 12
  sample_fps: 4
  samples_per_video: 8

  # 每张 H100 处理 16 条样本，三张卡的 global micro-batch 为 48。
  batch_size: 16
  # 每个 FSDP 进程各启动 8 个 worker，因此整机最多有 24 个解码 worker。
  workers: 8

model:
  # 从真实首帧开始，连续反馈模型自己的预测结果 4 步，约为 1 秒。
  auto_steps: 4
  # 每张卡本地 batch 共 16 x 12 = 192 帧；chunk size 192 可一次处理完整 batch。
  encoder_frame_chunk_size: 192

  action_encoder:
    binary_embedding_dim: 16
    hotbar_embedding_dim: 32
    camera_dim: 64
    cursor_dim: 64
    component_hidden_dim: 512
    tick_dim: 256
    depth: 2
    heads: 8
    mlp_dim: 1024
    macro_dim: 1024
    dropout: 0.0
    camera_clip_degrees: 180.0
    camera_mu: 255.0

  predictor:
    latent_dim: 1024
    action_dim: 1024
    dim: 1024
    depth: 24
    heads: 16
    mlp_dim: 4096
    context_blocks: 16
    spatial_grid: [18, 32]
    # 对齐 V-JEPA 2-AC，避免 rollout 逐步累积 dropout 噪声。
    dropout: 0.0
    # 正式训练启用，逐 block 重算激活以降低显存峰值。
    gradient_checkpointing: true

optimizer:
  learning_rate: 0.0001
  # 矩阵权重使用 0.04；bias 和一维参数由代码排除 weight decay。
  weight_decay: 0.04
  gradient_clip: 1.0
  # 16 samples/GPU x 3 GPUs x 1 micro-step = 48，因此不需要梯度累积。
  effective_batch_size: 48
  iterations_per_epoch: 200
  epochs: 30
  # 前约 400 个 optimizer steps 线性增大学习率，之后进入 cosine 衰减阶段。
  warmup_steps: 400

validation:
  # 三个 rank 分片验证；每 1,200 optimizer steps 各自最多处理 64 个 batches。
  # 指标会跨 rank 汇总，只有 rank 0 写日志和诊断图片。
  every_steps: 400
  batches: 64

checkpoint:
  # 只有 rank 0 写文件；checkpoint 保存三张卡各自的 RNG 和统一 sampler 位置。
  every_steps: 400
  keep_last: 3
  resume: null

distributed:
  # 必须使用 torchrun --nproc-per-node=3；直接运行 python 不会启用三卡。
  strategy: fsdp

wandb:
  # 只有 rank 0 连接 W&B 和写本地 metrics.jsonl。
  enabled: true
  mode: online
  entity: null
  project: mcwm
  group: m2-world-model-3xh100-sxm
  name: null
  tags: [vpt, contractor, m2, 3xh100-sxm, fsdp]
  log_every_steps: 10
  diagnostics_every_steps: 200

seed: 2026
# 正式训练要求 CUDA；单卡时不会额外套 FSDP wrapper。
device: cuda
precision: bf16
output_dir: artifacts/m1-visual-base
data:
  # 指向 M0 prepare_vpt 生成的 VPT contractor canonical dataset。
  root: data/canonical
  train_split: train
  validation_split: validation
  # V-JEPA 原版语义：每次访问视频时随机选起点，按 PTS 采样为每秒 4 帧。
  clip_frames: 16
  sample_fps: 4
  clips_per_video: 1
  # 每张 GPU 一次处理 16 个 clip；梯度累积次数由实际 GPU 数自动计算。
  batch_size: 16
  workers: 8
model:
  # 固定 640×360 和 20×20 patch；2-frame tubelet 得到 8×18×32=4608 tokens。
  image_height: 360
  image_width: 640
  patch_size: 20
  tubelet_size: 2
  use_rope: true
  encoder_dim: 1024
  encoder_depth: 24
  encoder_heads: 16
  encoder_mlp_dim: 4096
  predictor_dim: 384
  predictor_depth: 12
  predictor_heads: 12
  predictor_mlp_dim: 1536
  gradient_checkpointing: true
mask:
  # V-JEPA 2：8 个 15% 小块取并集，形成第一套预测 mask。
  - spatial_scale: [0.15, 0.15]
    temporal_scale: [1.0, 1.0]
    aspect_ratio: [0.75, 1.5]
    num_blocks: 8
  # 2 个 70% 大块取并集，形成第二套预测 mask；两套 loss 等权平均。
  - spatial_scale: [0.70, 0.70]
    temporal_scale: [1.0, 1.0]
    aspect_ratio: [0.75, 1.5]
    num_blocks: 2
augmentation:
  # 首轮训练关闭增强，保持 online 与 target 的像素内容一致。
  enabled: false
  brightness: 0.10
  gamma: 0.10
  color: 0.05
optimizer:
  # effective batch 通过每卡 batch × GPU 数 × accumulation 得到。
  learning_rate: 0.0001
  weight_decay: 0.05
  gradient_clip: 1.0
  effective_batch_size: 64
  # 总 optimizer steps = iterations_per_epoch × epochs = 24,000。
  iterations_per_epoch: 300
  epochs: 80
  # warmup 保持为 400 step。
  warmup_steps: 400
  ema_start: 0.999
  ema_end: 0.999
validation:
  # 每 1,200 step（4 个 epoch）验证一次；连续多次 collapse 才中止。
  every_steps: 1200
  # 每个 validation 视频使用 8 个固定、可复现的 clip，提高统计稳定性。
  clips_per_video: 8
  batches: 32
  collapse_check: true
collapse:
  # 前三次 validation 只观察暂态指标，不报警或累计坍塌次数。
  grace_validations: 3
  minimum_average_std: 0.4
  minimum_effective_rank: 8.0
  maximum_pairwise_cosine: 0.7
  patience_validations: 3
checkpoint:
  # 每 1,200 step 保存一次；resume 会校验数据 manifest hash 和关键训练配置。
  every_steps: 1200
  keep_last: 3
  resume: null
distributed:
  # torchrun 多进程时启用；单进程自动使用普通 nn.Module。
  strategy: fsdp
wandb:
  # API key 由 wandb login 或训练环境 secret 提供，不写入本文件。
  enabled: true
  mode: online
  entity: null
  project: mcwm
  group: m1-visual
  name: null
  tags: [vpt, contractor, from-scratch, m1]
  log_every_steps: 10
  diagnostics_every_steps: 200
  log_checkpoints: false
